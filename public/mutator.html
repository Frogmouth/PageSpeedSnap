<!DOCTYPE html>
<html lang="en" class="w-100 h-100">
<head>
    <meta charset="UTF-8"><title>PageSpeed Snap - mutator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        .invalid-tooltip {
            bottom: 0;
            width: 96%;
            margin-bottom: 10px;
            top: auto;
            transform: translatex(50%);
            margin-left: 0;
            right: 50%;
        }
    </style>
</head>
<body class="w-100 h-100">
    <div class="position-relative w-100 h-100">
        <textarea spellcheck="false" class="w-100 h-100 p-2 form-control" id="mutatorscript" placeholder="add custom Javascript code"></textarea>
        <div class="invalid-tooltip"></div>
    </div>
    <script src="mutator.js"></script>
</body></html>
